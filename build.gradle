plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Primary repositories
	maven {
		url = 'https://repo1.maven.org/maven2/'
	}
	maven { 
		url = 'https://maven.fabricmc.net/'
		content {
			includeGroup 'net.fabricmc'
		}
	}
	
	// Modrinth for mod dependencies
	maven { 
		url = 'https://api.modrinth.com/maven' 
		content {
			includeGroup 'maven.modrinth'
		}
	}
	
	// Terraformers for additional mods
	maven {
		url = 'https://maven.terraformersmc.com/releases/'
		content {
			includeGroup 'com.terraformersmc'
		}
	}
	
	// Fallback repositories (in case of Maven Central issues)
	maven { 
		url = 'https://repo.maven.apache.org/maven2/' 
	}
	maven { 
		url = 'https://jitpack.io' 
	}
}

loom {
	mods {
		"nozh" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	implementation 'com.google.code.gson:gson:2.10.1'

	modCompileOnly("maven.modrinth:modmenu:7.2.2") {
		transitive = false
	}
	modLocalRuntime("maven.modrinth:modmenu:7.2.2") {
		transitive = false
	}

	// --- JUnit 5 (Contract 2 tests) ---
	testImplementation platform('org.junit:junit-bom:5.10.1')
	testImplementation 'org.junit.jupiter:junit-jupiter-api'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
	testImplementation 'com.google.code.gson:gson:2.10.1'
}

test {
	useJUnitPlatform()
	maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
}

tasks.register('quickTest', JavaExec) {
	group = 'verification'
	description = 'Runs the modpack quick-test executor and writes JSON/CSV results.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.nozh.core.testing.ModpackQuickTestRunner'
	dependsOn testClasses

	def addArg = { prop, flag ->
		if (project.hasProperty(prop)) {
			args flag, project.property(prop).toString()
		}
	}

	addArg('modpack', '--modpack')
	addArg('seed', '--seed')
	addArg('scenarios', '--scenarios')
	addArg('outputDir', '--output')
	addArg('samplesDir', '--samples')
	addArg('warmupSeconds', '--warmup')
	addArg('measurementSeconds', '--measurement')
	addArg('cooldownSeconds', '--cooldown')
}

tasks.register('chaosTest', JavaExec) {
	group = 'verification'
	description = 'Runs the chaos test suite and writes JSON/CSV results.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'dev.nozh.core.testing.ChaosTestCli'

	dependsOn classes

	if (project.hasProperty('chaosSlowFactor')) {
		systemProperty 'nozh.chaos.slowFactor', project.property('chaosSlowFactor').toString()
	} else if (System.getenv('NOZH_CHAOS_SLOW_FACTOR')) {
		systemProperty 'nozh.chaos.slowFactor', System.getenv('NOZH_CHAOS_SLOW_FACTOR')
	}

	if (project.hasProperty('outputDir')) {
		args '--output', project.property('outputDir').toString()
	}
	if (project.hasProperty('failOnChaosError')) {
		boolean failOnError = project.property('failOnChaosError').toString().toBoolean()
		if (!failOnError) {
			args '--no-fail'
		}
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.release = 17
	options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		// publishing targets if needed
	}
}
