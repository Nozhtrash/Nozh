name: Validate lang files

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-lang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate NOZH lang JSON
        run: python .github/scripts/validate_lang.py
