name: 🐛 Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ Privacy Notice
        **DO NOT include personal information** such as:
        - Your real name, email, or location (unless necessary)
        - API keys, passwords, or tokens
        - File paths that reveal your username or system details
        - Screenshots with personal data visible
        
        Thank you for taking the time to report this issue!

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: What should happen...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: What actually happened...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: |
        Please copy and paste any relevant log output.
        **IMPORTANT**: Remove any personal information before pasting!
      render: shell
      placeholder: |
        [INFO] Starting mod...
        [ERROR] Something went wrong...

  - type: dropdown
    id: version
    attributes:
      label: Mod Version
      description: Which version are you using?
      options:
        - "1.0.0 (latest)"
        - "Development/main branch"
        - "Other (specify in additional context)"
    validations:
      required: true

  - type: input
    id: minecraft
    attributes:
      label: Minecraft Version
      description: What Minecraft version are you using?
      placeholder: "e.g., 1.20.1"
    validations:
      required: true

  - type: input
    id: fabric
    attributes:
      label: Fabric Loader Version
      description: What Fabric Loader version are you using?
      placeholder: "e.g., 0.15.3"
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Other Mods Installed
      description: List any other mods you have installed (potential conflicts)
      placeholder: |
        - Mod A v1.2.3
        - Mod B v2.1.0

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
      placeholder: Any additional information...

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have removed any personal/sensitive information from my report
          required: true
        - label: I am using the latest version of the mod
          required: false
        - label: I have included relevant logs (with personal info removed)
          required: false
